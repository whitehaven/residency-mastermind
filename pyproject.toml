[project]
name = "residency-mastermind"
version = "1.0.0dev1"
description = "Constraint satisfaction-based residency scheduling solver with support for complex structures of rotations, requirements, and preferences."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
core = [
    "mergedeep>=1.3.4",
    "polars>=1.44.1",
    "pyyaml>=6.0.3",
    "setuptools>=84.0.0",
]
solver = [
    "cpmpy>=1.0.0",
    "ortools>=9.15.6755",
]

[project.optional-dependencies]
testing = [
    "loguru>=0.7.3",
    "pytest>=9.1.1",
]
code-editor = [
    "ruff>=0.16.5",
]
hand-profiling = [
    "marimo>=0.24.0",
]
